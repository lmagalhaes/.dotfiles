# Options shared by every local domain. dnsmasq refuses to start when a
# keyword like cache-size appears twice, so keep them in this file only.

# Only answers for the domains in /etc/resolver, so never forwards upstream
no-resolv

# DNS cache optimization
cache-size=10000
min-cache-ttl=300
local-ttl=60
no-negcache

# Listen on both IPv4 and IPv6 loopback interfaces
listen-address=127.0.0.1
listen-address=::1
