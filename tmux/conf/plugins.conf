# Plugin Configuration
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'ghostty'

set -g @resurrect-dir "$XDG_DATA_HOME/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'

# Middle status line shows window name (#W), not the active pane's title
# (#T) — pane titles are rewritten live by programs like Claude Code and
# vim, which made tabs appear to change/revert on their own. Pane titles
# are still visible on the pane border itself (see core.conf).
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Bold the active pane's border (including its pane-border-format title)
set -g @catppuccin_pane_active_border_style \
  "##{?pane_in_mode,fg=#{@thm_lavender},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_lavender}}},bold"

set-environment -g TPACK_PLUGIN_PATH "$XDG_DATA_HOME/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'jaclu/tmux-menus'
# set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

run 'tpack init'
bind-key I run 'tpack install --tmux-echo'
